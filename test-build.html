const OWNER_HASH = '0e8de4485b0160a2dd913e687f397e4e1cf26fcffea89513f80e42fc2f66d895';

    return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('') === OWNER_HASH;
  } catch(e){ return false; }
}
